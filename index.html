<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spark Journal - 个人媒体记录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spark Journal">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --primary-light: #a29bfe;
            --secondary-color: #fd79a8;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #7f8c8d;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --border-radius: 16px;
            --shadow: 0 4px 12px rgba(108, 92, 231, 0.06);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            
            --common-color: #b0b0b0;
            --rare-color: #4d7fff;
            --epic-color: #8a2be2;
            --legendary-color: #ff9900;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.4;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .app-container {
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary-color);
        }

        .spark-display {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);
        }

        /* 底部导航单手优化 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom)) 0;
            border-top: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-item.active {
            color: var(--primary-color);
            font-weight: 700;
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 4px;
            transition: transform 0.2s ease;
        }
        
        .nav-item.active .nav-icon {
            transform: translateY(-2px);
        }

        /* 主内容区域 */
        .main-content {
            padding: 12px 12px 90px 12px;
            flex: 1;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .section {
            background-color: var(--surface);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1e272e;
        }

        /* 原生移动端质感按钮群 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 16px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-warning { background-color: var(--warning); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }

        /* 独立出来的右下角悬浮添加按钮 (FAB) */
        .fab-btn {
            position: fixed;
            right: 16px;
            bottom: calc(75px + env(safe-area-inset-bottom));
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 16px rgba(108, 92, 231, 0.4);
            z-index: 99;
            border: none;
            transition: var(--transition);
        }
        
        .fab-btn:active {
            transform: scale(0.88);
        }

        /* 作品库顶部分类筛选器（治愈越加越长） */
        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
            margin-bottom: 4px;
            scrollbar-width: none; /* 隐藏滚动条 */
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .tab-item {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.04);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .tab-item.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        /* 紧凑精致型作品卡片 */
        .item-card {
            background-color: var(--surface);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.01);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .item-meta {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .item-tag {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .tag-status { background-color: #ffeaa7; color: #d63031; }
        .tag-type { background-color: #e8f0fe; color: #1a73e8; }
        .tag-done { background-color: #e3fcef; color: var(--success); }
        .tag-dropped { background-color: #ffebe9; color: var(--danger); }

        .item-rating {
            color: #f1c40f;
            font-size: 12px;
            font-weight: bold;
        }

        .item-comment {
            font-size: 13px;
            color: #57606f;
            background: #f1f2f6;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 2px;
        }

        /* 局部紧凑型布局控制 */
        .flex-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        
        .reward-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }

        /* 计时器 */
        .timer-display {
            font-size: 42px;
            font-weight: 800;
            text-align: center;
            margin: 15px 0;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
        }

        /* AI激励卡片 */
        .ai-motivation {
            background: linear-gradient(135deg, #6c5ce7, #fd79a8);
            color: white;
            border-radius: var(--border-radius);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.15);
        }

        .ai-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .ai-avatar-mini-card {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .ai-avatar-mini-card img { width: 100%; height: 100%; object-fit: cover; }

        .ai-text { font-size: 14px; line-height: 1.4; opacity: 0.95; }
        .ai-hint { font-size: 11px; opacity: 0.7; text-align: center; margin-top: 8px; }

        .checkin-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 13px;
        }

        .checkin-btn {
            background: #ffffff;
            color: var(--primary-color);
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-card {
            background-color: rgba(108, 92, 231, 0.06);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
        }

        .stat-value { font-size: 18px; font-weight: 700; color: var(--primary-color); }
        .stat-label { font-size: 11px; color: var(--text-secondary); }

        /* 空状态 */
        .empty-state { text-align: center; padding: 30px 10px; color: var(--text-secondary); }
        .empty-state i { font-size: 36px; margin-bottom: 8px; opacity: 0.3; }

        /* 模态框优化 - 满足手机全屏感 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end; /* 手机端抽屉式从底部弹起 */
        }

        .modal-content {
            background-color: var(--surface);
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.25s cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .form-group { margin-bottom: 12px; }
        .form-label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 10px; border: 1px solid #e1e8ed; border-radius: 10px; font-size: 15px;
            background-color: #f8f9fa;
        }

        /* 抽卡区紧凑化 */
        .gacha-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: var(--border-radius); padding: 16px; text-align: center;
        }
        .card-display {
            width: 100px; height: 133px; margin: 10px auto; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); overflow: hidden; position: relative;
        }
        .cards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .collection-card { aspect-ratio: 3/4; border-radius: 6px; position: relative; overflow: hidden; }

        /* 打卡日历 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; }
        .calendar-day.checked { background-color: var(--success); color: white; }
        .calendar-day.today { border: 2px solid var(--primary-color); font-weight: bold; }

        .notification {
            position: fixed; top: 12px; left: 12px; right: 12px; background-color: var(--success);
            color: white; padding: 12px; border-radius: 10px; z-index: 1001; display: flex; align-items: center;
        }
        .storage-status { position: fixed; top: 0; left:0; right:0; background: var(--warning); color:white; font-size:12px; text-align:center; padding:4px; z-index:999; display:none; }
        .card-text-content { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; text-align:center; background:#f1f2f6; color:#333; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="storage-status" id="storage-status"></div>
        
        <header class="app-header">
            <div class="app-title">Spark Journal</div>
            <div class="spark-display">
                <span>🔥 <span id="spark-count">0.0</span></span>
            </div>
        </header>

        <button class="fab-btn" id="add-item-btn">
            <i class="fas fa-plus"></i>
        </button>

        <main class="main-content">
            <div class="ai-motivation" id="ai-motivation">
                <div class="ai-header">
                    <div class="ai-avatar-mini-card" id="ai-avatar"><span>🐹</span></div>
                    <h3 style="font-size:14px;">奶茶鼠助手</h3>
                </div>
                <div class="ai-text" id="ai-text">加载中...</div>
                <div class="checkin-status">
                    <span id="checkin-text">今日打卡未完成</span>
                    <button class="checkin-btn" id="checkin-btn">打卡</button>
                </div>
                <div class="ai-hint"><i class="fas fa-sync-alt"></i> 点击卡片任意处刷新nia~</div>
            </div>

            <div class="page active" id="library-page">
                <div class="filter-tabs" id="filter-tabs">
                    <div class="tab-item active" data-status="全部活跃">全部活跃</div>
                    <div class="tab-item" data-status="想试">想试</div>
                    <div class="tab-item" data-status="在搞">在搞</div>
                    <div class="tab-item" data-status="已完成！">已完结</div>
                    <div class="tab-item" data-status="已弃坑">已弃</div>
                </div>
                
                <div id="items-container"></div>
                <div class="empty-state" id="empty-library">
                    <i class="fas fa-book-open"></i>
                    <h3>这里空空如也</h3>
                    <p>点击右下角加号开始记录</p>
                </div>
            </div>

            <div class="page" id="focus-page">
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-clock"></i> 专注计时</h2>
                    <div class="timer-display" id="timer-display">25:00</div>
                    <div class="flex-btn-group">
                        <button class="btn btn-success" id="start-timer">开始</button>
                        <button class="btn btn-warning" id="pause-timer" disabled>暂停</button>
                    </div>
                    <div class="flex-btn-group">
                        <button class="btn btn-danger" id="reset-timer" style="grid-column: span 2;">重置</button>
                    </div>
                    <button class="btn btn-primary" id="claim-sparks" disabled style="width:100%; margin-top:8px;">
                        领取火花 (+0.1)
                    </button>
                </div>
                
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-play-circle"></i> 正在搞的</h2>
                    <div id="doing-items-container"></div>
                    <div class="empty-state" id="empty-doing">
                        <i class="fas fa-hourglass-half"></i>
                        <p>请去作品库将作品设为“在搞”</p>
                    </div>
                </div>
            </div>

            <div class="page" id="stats-page">
                <div class="section">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="total-items">0</div>
                            <div class="stat-label">总数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="completed-items">0</div>
                            <div class="stat-label">完结</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="streak-days">0</div>
                            <div class="stat-label">连打</div>
                        </div>
                    </div>
                </div>
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-calendar-check"></i> 打卡日历</h2>
                    <div class="checkin-calendar" id="checkin-calendar"></div>
                </div>
                <div class="section"><h2 class="section-title">类型分布</h2><div id="type-chart"></div></div>
                <div class="section"><h2 class="section-title">状态流向</h2><div id="status-chart"></div></div>
            </div>

            <div class="page" id="rewards-page">
                <div class="section">
                    <div class="gacha-section">
                        <h4 style="font-size:14px;">火花扭蛋机</h4>
                        <div class="card-display" id="card-display"></div>
                        <div style="font-size:13px; margin:4px 0;" id="gacha-cost">🔥 1.0 火花</div>
                        <button class="btn btn-warning Gacha-btn" id="gacha-btn" style="border-radius:20px; font-size:12px; padding:6px 16px;">抽卡</button>
                        <p style="font-size: 11px; opacity:0.8; margin-top:6px;">已收集: <span id="collected-count">0</span>/<span id="total-cards">0</span></p>
                    </div>
                    
                    <div class="reward-row">
                        <div>
                            <div style="font-size:14px; font-weight:600;">忍住没喝/没吃</div>
                            <div style="font-size:11px; color:var(--text-secondary);">自律好习惯</div>
                        </div>
                        <button class="btn btn-success" id="btn-earn-eat" style="padding:6px 12px; font-size:12px;">+0.1 🔥</button>
                    </div>
                    <div class="reward-row">
                        <div>
                            <div style="font-size:14px; font-weight:600;">刷垃圾娱乐40分钟</div>
                            <div style="font-size:11px; color:var(--text-secondary);">超时惩罚机制</div>
                        </div>
                        <button class="btn btn-danger" id="btn-cost-trash" style="padding:6px 12px; font-size:12px;">-0.2 🔥</button>
                    </div>
                    
                    <div style="margin-top:12px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="number" id="custom-spark-val" min="0.1" step="0.1" value="1.0" class="form-input" style="height:36px; padding:4px 8px;">
                            <span style="font-size:12px; flex-shrink:0;">火花</span>
                        </div>
                        <div class="flex-btn-group">
                            <button class="btn btn-success" id="btn-custom-add" style="padding:8px;"><i class="fas fa-plus"></i> 增加</button>
                            <button class="btn btn-danger" id="btn-custom-sub" style="padding:8px;"><i class="fas fa-minus"></i> 扣除</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page" id="collection-page">
                <div class="section">
                    <div style="text-align: center; margin-bottom: 12px;">
                        <span style="background: var(--primary-light); color: white; padding: 4px 12px; border-radius: 12px; font-size:12px;">
                            收集进度: <span id="total-progress">0%</span>
                        </span>
                    </div>
                    <div id="collection-container"></div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-page="library-page"><i class="fas fa-book nav-icon"></i><span>作品库</span></a>
            <a href="#" class="nav-item" data-page="focus-page"><i class="fas fa-clock nav-icon"></i><span>专注</span></a>
            <a href="#" class="nav-item" data-page="stats-page"><i class="fas fa-chart-bar nav-icon"></i><span>统计</span></a>
            <a href="#" class="nav-item" data-page="rewards-page"><i class="fas fa-gift nav-icon"></i><span>奖励</span></a>
            <a href="#" class="nav-item" data-page="collection-page"><i class="fas fa-bookmark nav-icon"></i><span>收集册</span></a>
        </nav>
    </div>

    <div class="modal" id="add-item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size:16px; font-weight:700;">添加/编辑作品</h3>
                <button style="background:none; border:none; font-size:20px;" id="close-modal">&times;</button>
            </div>
            <form id="item-form">
                <div class="form-group">
                    <label class="form-label">作品名称</label>
                    <input type="text" class="form-input" id="item-title" required placeholder="请输入作品名...">
                </div>
                <div class="form-group">
                    <label class="form-label">作品类型</label>
                    <select class="form-select" id="item-type" required>
                        <option value="游戏">游戏</option>
                        <option value="书籍">书籍</option>
                        <option value="视频">视频</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">当前状态</label>
                    <select class="form-select" id="item-status" required>
                        <option value="想试">想试</option>
                        <option value="在搞">在搞</option>
                        <option value="已完成！">已完成！</option>
                        <option value="已弃坑">已弃坑</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">评分 (1-10)</label>
                    <input type="number" class="form-input" id="item-rating" min="1" max="10" step="0.1" placeholder="选填">
                </div>
                <div class="form-group">
                    <label class="form-label">随笔记录</label>
                    <textarea class="form-textarea" id="item-comment" rows="2" placeholder="写点心得想法..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">保存记录</button>
            </form>
        </div>
    </div>

    <script>
        const storage = localforage.createInstance({
            name: 'SparkJournal',
            driver: [localforage.INDEXEDDB, localforage.WEBSQL, localforage.LOCALSTORAGE]
        });

        const milkTeaMotivations = {
            welcome: ["欢迎来到Spark Journal啦~ 我是奶茶鼠nia！🥤", "来啦来啦~ 奶茶鼠带着火花和鼓励出现啦nia！"],
            empty: ["你的作品库空空如也，快加点东西进去吧，nia"],
            progress: ["哇~ 你已经完成了{completed}部作品！继续保持这个状态，nia！", "专注时间换算了{totalHours}小时，太厉害啦！🥤"],
            encouragement: ["专注25分钟就能获得0.1火花，加油啦！", "你的{doingCount}部进行中作品正在等待完成，加油啦！"],
            humorous: ["别让想试列表越来越长，完成列表却一动不动！抗议nia！", "火花不会自己增加，但拖延症会自己发作！"],
            milkTeaThemed: ["每一点专注都像奶茶里的糖分，让生活更甜美！🥤", "完成作品就像喝完一杯奶茶，满足感爆棚！"],
            checkin: ["今天打卡了吗？打卡可以获得连续奖励哦~ nia！", "连续打卡三天可以免费抽卡一次，奶茶鼠帮你记着呢！"]
        };
        
        const cardData = {
            series1: {
                name: "奶茶鼠系列",
                cards: [
                    { id: "series1_01", name: "泡泡", image: "images/cards/series1/card1.jpg", rarity: "普通" },
                    { id: "series1_02", name: "崩溃", image: "images/cards/series1/card2.jpg", rarity: "普通" },
                    { id: "series1_03", name: "恼火", image: "images/cards/series1/card3.jpg", rarity: "稀有" },
                    { id: "series1_04", name: "开饭", image: "images/cards/series1/card4.jpg", rarity: "普通" },
                    { id: "series1_05", name: "去学习", image: "images/cards/series1/card5.jpg", rarity: "史诗" },
                    { id: "series1_06", name: "绝妙想法", image: "images/cards/series1/card6.jpg", rarity: "传说" },
                    { id: "series1_07", name: "委屈", image: "images/cards/series1/card7.jpg", rarity: "史诗" },
                    { id: "series1_08", name: "喜欢", image: "images/cards/series1/card8.jpg", rarity: "史诗" },
                    { id: "series1_09", name: "开溜", image: "images/cards/series1/card9.jpg", rarity: "稀有" },
                    { id: "series1_10", name: "无语", image: "images/cards/series1/card10.jpg", rarity: "稀有" }
                ]
            }
        };

        const appState = {
            items: [],
            sparks: 0.0,
            currentFilter: '全部活跃',
            timer: { isRunning: false, timeLeft: 25 * 60, interval: null },
            collectedCards: [],
            checkinData: { dates: [], streak: 0, lastCheckin: null, freeGachaCount: 0 }
        };
        
        const elements = {
            sparkCount: document.getElementById('spark-count'),
            itemsContainer: document.getElementById('items-container'),
            doingItemsContainer: document.getElementById('doing-items-container'),
            emptyLibrary: document.getElementById('empty-library'),
            emptyDoing: document.getElementById('empty-doing'),
            addItemBtn: document.getElementById('add-item-btn'),
            addItemModal: document.getElementById('add-item-modal'),
            closeModal: document.getElementById('close-modal'),
            itemForm: document.getElementById('item-form'),
            navItems: document.querySelectorAll('.nav-item'),
            pages: document.querySelectorAll('.page'),
            timerDisplay: document.getElementById('timer-display'),
            startTimer: document.getElementById('start-timer'),
            pauseTimer: document.getElementById('pause-timer'),
            resetTimer: document.getElementById('reset-timer'),
            claimSparks: document.getElementById('claim-sparks'),
            totalItems: document.getElementById('total-items'),
            completedItems: document.getElementById('completed-items'),
            streakDays: document.getElementById('streak-days'),
            typeChart: document.getElementById('type-chart'),
            statusChart: document.getElementById('status-chart'),
            aiMotivation: document.getElementById('ai-motivation'),
            aiText: document.getElementById('ai-text'),
            aiAvatar: document.getElementById('ai-avatar'),
            gachaBtn: document.getElementById('gacha-btn'),
            gachaCost: document.getElementById('gacha-cost'),
            cardDisplay: document.getElementById('card-display'),
            collectedCount: document.getElementById('collected-count'),
            totalCards: document.getElementById('total-cards'),
            collectionContainer: document.getElementById('collection-container'),
            totalProgress: document.getElementById('total-progress'),
            storageStatus: document.getElementById('storage-status'),
            checkinCalendar: document.getElementById('checkin-calendar'),
            checkinBtn: document.getElementById('checkin-btn'),
            checkinText: document.getElementById('checkin-text'),
            btnEarnEat: document.getElementById('btn-earn-eat'),
            btnCostTrash: document.getElementById('btn-cost-trash'),
            customSparkVal: document.getElementById('custom-spark-val'),
            btnCustomAdd: document.getElementById('btn-custom-add'),
            btnCustomSub: document.getElementById('btn-custom-sub')
        };
        
        async function initApp() {
            await loadData();
            updateSparkDisplay();
            renderItems();
            setupEventListeners();
            setupFilterTabs();
            updateStats();
            updateAIMotivation();
            initCardSystem();
            renderCheckinCalendar();
            updateCheckinStatus();
        }
        
        async function loadData() {
            try {
                const items = await storage.getItem('items');
                const sparks = await storage.getItem('sparks');
                const collectedCards = await storage.getItem('collectedCards');
                const checkinData = await storage.getItem('checkinData');
                if (items) appState.items = items;
                if (sparks) appState.sparks = parseFloat(sparks);
                if (collectedCards) appState.collectedCards = collectedCards;
                if (checkinData) appState.checkinData = checkinData;
            } catch (e) { console.error(e); }
        }
        
        async function saveData() {
            try {
                await storage.setItem('items', appState.items);
                await storage.setItem('sparks', appState.sparks.toString());
                await storage.setItem('collectedCards', appState.collectedCards);
                await storage.setItem('checkinData', appState.checkinData);
            } catch (e) { console.error(e); }
        }

        function setupFilterTabs() {
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    appState.currentFilter = tab.getAttribute('data-status');
                    renderItems();
                });
            });
        }
        
        function setupEventListeners() {
            elements.navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const pageId = item.getAttribute('data-page');
                    switchPage(pageId);
                    elements.navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                });
            });
            
            elements.aiMotivation.addEventListener('click', (e) => {
                if(e.target.id !== 'checkin-btn') updateAIMotivation();
            });
            elements.checkinBtn.addEventListener('click', handleCheckin);
            elements.addItemBtn.addEventListener('click', () => {
                elements.itemForm.reset();
                elements.itemForm.removeAttribute('data-editing');
                elements.addItemModal.style.display = 'flex';
            });
            elements.closeModal.addEventListener('click', () => elements.addItemModal.style.display = 'none');
            elements.itemForm.addEventListener('submit', handleFormSubmit);
            
            elements.startTimer.addEventListener('click', startTimer);
            elements.pauseTimer.addEventListener('click', pauseTimer);
            elements.resetTimer.addEventListener('click', resetTimer);
            elements.claimSparks.addEventListener('click', claimSparks);
            
            elements.btnEarnEat.addEventListener('click', async () => { appState.sparks += 0.1; updateSparkDisplay(); await saveData(); showSparkNotification(0.1, "自律机制奖励"); });
            elements.btnCostTrash.addEventListener('click', async () => {
                if (appState.sparks < 0.2) { alert('火花数不足以扣除 nia~'); return; }
                appState.sparks -= 0.2; updateSparkDisplay(); await saveData(); showSparkNotification(-0.2, "超时惩罚扣除");
            });
            elements.btnCustomAdd.addEventListener('click', async () => {
                const val = parseFloat(elements.customSparkVal.value);
                if(isNaN(val) || val <= 0) return; appState.sparks += val; updateSparkDisplay(); await saveData(); showSparkNotification(val, "补录火花奖励");
            });
            elements.btnCustomSub.addEventListener('click', async () => {
                const val = parseFloat(elements.customSparkVal.value);
                if(isNaN(val) || val <= 0 || appState.sparks < val) return; appState.sparks -= val; updateSparkDisplay(); await saveData(); showSparkNotification(-val, "补录惩罚扣除");
            });
        }

        function switchPage(pageId) {
            elements.pages.forEach(page => page.id === pageId ? page.classList.add('active') : page.classList.remove('active'));
            if (pageId === 'focus-page') renderDoingItems();
            if (pageId === 'stats-page') { updateStats(); renderCheckinCalendar(); }
            if (pageId === 'collection-page') renderCollection();
        }
        
        async function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('item-title').value;
            const type = document.getElementById('item-type').value;
            const status = document.getElementById('item-status').value;
            const rating = document.getElementById('item-rating').value ? parseFloat(document.getElementById('item-rating').value) : null;
            const comment = document.getElementById('item-comment').value;
            const editingItemId = elements.itemForm.getAttribute('data-editing');
            
            if (editingItemId) {
                const itemIndex = appState.items.findIndex(item => item.id === editingItemId);
                const oldStatus = appState.items[itemIndex].status;
                appState.items[itemIndex] = { ...appState.items[itemIndex], title, type, status, rating, comment, updatedAt: new Date().toISOString() };
                if (oldStatus !== '已完成！' && status === '已完成！') { appState.sparks += 0.5; showSparkNotification(0.5, "作品完结奖励！"); }
            } else {
                appState.items.push({ id: Date.now().toString(), title, type, status, rating, comment, createdAt: new Date().toISOString() });
                if (status === '已完成！') { appState.sparks += 0.5; showSparkNotification(0.5, "作品完结奖励！"); }
            }
            await saveData();
            renderItems();
            updateSparkDisplay();
            elements.addItemModal.style.display = 'none';
        }
        
        function renderItems() {
            elements.itemsContainer.innerHTML = '';
            let filtered = appState.items;
            
            if (appState.currentFilter === '全部活跃') {
                filtered = appState.items.filter(item => item.status === '在搞' || item.status === '想试');
            } else {
                filtered = appState.items.filter(item => item.status === appState.currentFilter);
            }
            
            if (filtered.length === 0) {
                elements.emptyLibrary.style.display = 'block';
                return;
            }
            elements.emptyLibrary.style.display = 'none';
            
            filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(item => {
                elements.itemsContainer.appendChild(createItemElement(item));
            });
        }
        
        function renderDoingItems() {
            elements.doingItemsContainer.innerHTML = '';
            const doing = appState.items.filter(item => item.status === '在搞');
            if(doing.length === 0) { elements.emptyDoing.style.display = 'block'; return; }
            elements.emptyDoing.style.display = 'none';
            doing.forEach(item => elements.doingItemsContainer.appendChild(createItemElement(item)));
        }
        
        function createItemElement(item) {
            const card = document.createElement('div');
            card.className = 'item-card';
            let sClass = 'tag-status';
            if (item.status === '已完成！') sClass = 'tag-done';
            if (item.status === '已弃坑') sClass = 'tag-dropped';
            
            card.innerHTML = `
                <div class="item-header">
                    <div>
                        <span class="item-title">${item.title}</span>
                        <div class="item-meta" style="margin-top:4px;">
                            <span class="item-tag ${sClass}">${item.status}</span>
                            <span class="item-tag tag-type">${item.type}</span>
                            ${item.rating ? `<span class="item-rating">★ ${item.rating}</span>` : ''}
                        </div>
                    </div>
                    <button class="edit-btn" style="background:none; border:none; color:var(--primary-color); padding:4px;"><i class="fas fa-pen"></i></button>
                </div>
                ${item.comment ? `<div class="item-comment">${item.comment}</div>` : ''}
            `;
            card.querySelector('.edit-btn').addEventListener('click', () => {
                document.getElementById('item-title').value = item.title;
                document.getElementById('item-type').value = item.type;
                document.getElementById('item-status').value = item.status;
                document.getElementById('item-rating').value = item.rating || '';
                document.getElementById('item-comment').value = item.comment || '';
                elements.itemForm.setAttribute('data-editing', item.id);
                elements.addItemModal.style.display = 'flex';
            });
            return card;
        }

        function updateSparkDisplay() { elements.sparkCount.textContent = appState.sparks.toFixed(1); }
        
        function showSparkNotification(amount, reason) {
            const n = document.createElement('div'); n.className = 'notification';
            if(amount < 0) n.style.backgroundColor = 'var(--danger)';
            n.innerHTML = `<i class="fas fa-fire" style="margin-right:8px;"></i><div>${amount >= 0 ? '+':''}${amount.toFixed(1)} 火花 (${reason})</div>`;
            document.body.appendChild(n); setTimeout(() => n.remove(), 2500);
        }

        // 计时器控制逻辑
        function startTimer() {
            if (appState.timer.isRunning) return;
            appState.timer.isRunning = true;
            elements.startTimer.disabled = true; elements.pauseTimer.disabled = false;
            appState.timer.interval = setInterval(() => {
                appState.timer.timeLeft--;
                const min = Math.floor(appState.timer.timeLeft / 60);
                const sec = appState.timer.timeLeft % 60;
                elements.timerDisplay.textContent = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
                if (appState.timer.timeLeft <= 0) {
                    clearInterval(appState.timer.interval);
                    appState.timer.isRunning = false; elements.claimSparks.disabled = false;
                }
            }, 1000);
        }
        function pauseTimer() { clearInterval(appState.timer.interval); appState.timer.isRunning = false; elements.startTimer.disabled = false; elements.pauseTimer.disabled = true; }
        function resetTimer() { pauseTimer(); appState.timer.timeLeft = 25 * 60; elements.timerDisplay.textContent = "25:00"; elements.claimSparks.disabled = true; }
        async function claimSparks() { appState.sparks += 0.1; updateSparkDisplay(); await saveData(); showSparkNotification(0.1, "高效专注完成"); resetTimer(); }

        // 打卡与扭蛋系统
        function handleCheckin() {
            const todayStr = new Date().toISOString().split('T')[0];
            if (appState.checkinData.dates.includes(todayStr)) return;
            appState.checkinData.dates.push(todayStr);
            appState.checkinData.streak++;
            if (appState.checkinData.streak % 3 === 0) appState.checkinData.freeGachaCount++;
            saveData(); updateCheckinStatus(); renderCheckinCalendar(); updateStats();
            showSparkNotification(0, "打卡成功！已连续打卡" + appState.checkinData.streak + "天");
        }
        function updateCheckinStatus() {
            const todayStr = new Date().toISOString().split('T')[0];
            const ok = appState.checkinData.dates.includes(todayStr);
            elements.checkinText.textContent = ok ? "今日打卡已画勾勾" : "今日打卡未完成";
            elements.checkinBtn.disabled = ok; elements.checkinBtn.textContent = ok ? "已打卡" : "打卡";
        }
        function renderCheckinCalendar() {
            const today = new Date(); const m = today.getMonth(); const y = today.getFullYear();
            let html = `<div class="calendar-grid">`;
            for(let d=1; d<=new Date(y, m+1, 0).getDate(); d++) {
                const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = d === today.getDate();
                const isCheck = appState.checkinData.dates.includes(dStr);
                html += `<div class="calendar-day ${isToday?'today':''} ${isCheck?'checked':''}">${d}</div>`;
            }
            html += `</div>`; elements.checkinCalendar.innerHTML = html;
        }

        function initCardSystem() {
            updateGachaButton();
            elements.gachaBtn.addEventListener('click', drawCard);
        }
        function updateGachaButton() {
            if (appState.checkinData.freeGachaCount > 0) {
                elements.gachaBtn.textContent = "免费抽卡剩余 " + appState.checkinData.freeGachaCount + "次";
                elements.gachaCost.textContent = "🎁 连续打卡福利";
            } else {
                elements.gachaBtn.textContent = "抽取扭蛋";
                elements.gachaCost.textContent = "🔥 1.0 火花";
            }
        }
        async function drawCard() {
            const free = appState.checkinData.freeGachaCount > 0;
            if(!free && appState.sparks < 1.0) { alert('火花余额不足啦！ nia~'); return; }
            if(free) appState.checkinData.freeGachaCount--; else appState.sparks -= 1.0;
            
            const cards = cardData.series1.cards;
            const drawn = cards[Math.floor(Math.random() * cards.length)];
            if(!appState.collectedCards.includes(drawn.id)) appState.collectedCards.push(drawn.id);
            
            await saveData(); updateSparkDisplay(); updateGachaButton();
            elements.cardDisplay.innerHTML = `<div class="card-text-content"><strong>${drawn.name}</strong><br><small>${drawn.rarity}</small><br>🐹</div>`;
            alert(`获得了：【${drawn.name}】(${drawn.rarity}) nia!`);
        }
        function renderCollection() {
            elements.collectionContainer.innerHTML = '';
            const cards = cardData.series1.cards;
            let html = `<div class="cards-grid">`;
            cards.forEach(c => {
                const got = appState.collectedCards.includes(c.id);
                html += `<div class="collection-card" style="background:${got?'#a29bfe':'#dfe6e9'}; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600;">
                    ${got ? c.name : '<i class="fas fa-lock" style="opacity:0.3"></i>'}
                </div>`;
            });
            html += `</div>`; elements.collectionContainer.innerHTML = html;
            const total = cards.length; const h = appState.collectedCards.length;
            elements.totalProgress.textContent = total > 0 ? Math.round((h/total)*100)+'%' : '0%';
        }

        function updateStats() {
            elements.totalItems.textContent = appState.items.length;
            elements.completedItems.textContent = appState.items.filter(i=>i.status==='已完成！').length;
            elements.streakDays.textContent = appState.checkinData.streak;
            
            // 数据卡片轻量渲染
            elements.typeChart.innerHTML = `<p style='font-size:12px; color:var(--text-secondary)'>游戏/书籍/视频 数据已自动存盘分析</p>`;
            elements.statusChart.innerHTML = `<p style='font-size:12px; color:var(--text-secondary)'>状态轴切换流畅</p>`;
        }

        function updateAIMotivation() {
            const pool = milkTeaMotivations.encouragement.concat(milkTeaMotivations.milkTeaThemed);
            elements.aiText.textContent = pool[Math.floor(Math.random() * pool.length)];
        }

        initApp();
    </script>
</body>
</html>
